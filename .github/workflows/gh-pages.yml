name: GitHub Pages

on:
  push:
    tags: "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm install
      - run: npm run docs
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/.vitepress/dist
